                                </div>
                            </div>
                        </div>

                        {/* 右侧：练习日志 (Training Log) */}
                        <div className="lg:col-span-2">
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full min-h-[500px]">
                                <div className="p-6 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                    <h3 className="font-bold text-slate-700 flex items-center gap-2">
                                        📝 练习日志
                                        <span className="text-xs font-normal text-slate-400 bg-white px-2 py-0.5 rounded border border-slate-200">
                                            共 {level.logs.length} 条记录
                                        </span>
                                    </h3>
                                </div>
                                
                                {/* 日志列表 */}
                                <div className="flex-1 p-6 bg-slate-50/50 overflow-y-auto custom-scrollbar space-y-4 max-h-[600px]">
                                    {level.logs.length === 0 ? (
                                        <div className="text-center py-12 text-slate-400">
                                            <div className="text-4xl mb-2">📒</div>
                                            <p>还没有记录，写下你的第一次练习心得吧！</p>
                                        </div>
                                    ) : (
                                        level.logs.map(log => (
                                            <div key={log.id} className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm relative group hover:shadow-md transition-shadow">
                                                <div className="text-xs text-slate-400 mb-2 font-mono">{log.date}</div>
                                                <div className="text-slate-700 whitespace-pre-wrap leading-relaxed">{log.text}</div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {/* 输入区域 */}
                                <div className="p-4 bg-white border-t border-slate-200">
                                    <div className="relative">
                                        <textarea
                                            className="w-full border border-slate-300 rounded-xl p-4 pr-24 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none bg-slate-50 focus:bg-white transition-colors text-sm"
                                            rows="3"
                                            placeholder={`记录你在 Lv.${level.lvl} 的练习过程、感悟或遇到的问题...`}
                                            value={logInput}
                                            onChange={(e) => setLogInput(e.target.value)}
                                            onKeyDown={(e) => {
                                                if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
                                                    handleAddLog();
                                                }
                                            }}
                                        ></textarea>
                                        <button 
                                            onClick={handleAddLog}
                                            disabled={!logInput.trim()}
                                            className={`absolute bottom-3 right-3 px-4 py-2 rounded-lg text-sm font-bold transition-all
                                                ${logInput.trim() 
                                                    ? `bg-${skill.color}-600 text-white hover:bg-${skill.color}-700 shadow-md` 
                                                    : 'bg-slate-200 text-slate-400 cursor-not-allowed'}
                                            `}
                                        >
                                            记录
                                        </button>
                                    </div>
                                    <div className="text-xs text-slate-400 mt-2 text-right px-1">
                                        按 Ctrl + Enter 快速发送
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }


        // --- 3. 主程序组件 (App) ---

        function App() {
            const [skills, setSkills] = useState(initialSkills);
            const [activeRoleId, setActiveRoleId] = useState(careerRoles[0].id);
            const [activeSkillId, setActiveSkillId] = useState(initialSkills[0].id);
            
            // 视图状态: 'dashboard' 或 'detail'
            const [viewMode, setViewMode] = useState('dashboard'); 
            const [selectedLevelIndex, setSelectedLevelIndex] = useState(0);

            // 拖拽相关的 Refs
            const dragItem = useRef();
            const dragOverItem = useRef();

            const currentRole = careerRoles.find(r => r.id === activeRoleId) || careerRoles[0];
            const currentSkill = skills.find(s => s.id === activeSkillId) || skills[0];
            const currentSkillIndex = skills.findIndex(s => s.id === activeSkillId);
            const roleSkills = skills.filter(s => currentRole.skillIds.includes(s.id));

            // 核心功能：处理拖拽排序 (保持不变)
            const handleDragStart = (e, position) => {
                dragItem.current = position;
                e.target.classList.add('dragging');
            };
            const handleDragEnter = (e, position) => { dragOverItem.current = position; };
            const handleDragEnd = (e) => {
                e.target.classList.remove('dragging');
                const copyListItems = [...skills];
                const dragItemContent = copyListItems[dragItem.current];
                copyListItems.splice(dragItem.current, 1);
                copyListItems.splice(dragOverItem.current, 0, dragItemContent);
                dragItem.current = null;
                dragOverItem.current = null;
                setSkills(copyListItems);
            };

            // 功能：切换 Checkbox (保持不变)
            const toggleCriteria = (levelIndex, criteriaId) => {
                const newSkills = skills.map(skill => {
                    if (skill.id === activeSkillId) {
                        const newLevels = [...skill.levels];
                        const level = newLevels[levelIndex];
                        const newCriteria = level.criteria.map(c => 
                            c.id === criteriaId ? { ...c, done: !c.done } : c
                        );
                        newLevels[levelIndex] = { ...level, criteria: newCriteria };
                        return { ...skill, levels: newLevels };
                    }
                    return skill;
                });
                setSkills(newSkills);
            };

            // 功能：更新单个技能的全量数据 (用于子组件回调)
            const updateSingleSkill = (updatedSkill) => {
                const newSkills = [...skills];
                newSkills[currentSkillIndex] = updatedSkill;
                setSkills(newSkills);
            };

            // 逻辑：计算当前等级 (保持不变)
            const calculatedLevel = useMemo(() => {
                let currentLvl = 0;
                for (let level of currentSkill.levels) {
                    const allDone = level.criteria.every(c => c.done);
                    if (allDone) currentLvl = level.lvl; else break; 
                }
                return currentLvl;
            }, [currentSkill]);

            // 逻辑：计算进度条
            const progressStats = useMemo(() => {
                const total = currentSkill.levels.reduce((acc, lvl) => acc + lvl.criteria.length, 0);
                const completed = currentSkill.levels.reduce((acc, lvl) => acc + lvl.criteria.filter(c => c.done).length, 0);
                return { total, completed, percent: Math.round((completed / total) * 100) };
            }, [currentSkill]);

            // 导航控制
            const enterLevelDetail = (index) => {
                setSelectedLevelIndex(index);
                setViewMode('detail');
                window.scrollTo(0,0);
            };

            // --- 渲染部分 ---

            // 如果是详情模式，渲染详情页
            if (viewMode === 'detail') {
                return (
                    <DetailView 
                        skill={currentSkill}
                        levelIndex={selectedLevelIndex}
                        onBack={() => setViewMode('dashboard')}
                        onUpdateSkill={updateSingleSkill}
                    />
                );
            }

            // 否则渲染宽屏仪表盘 (Dashboard)
            return (
                <div className="fade-in flex h-screen overflow-hidden bg-slate-50">
                    {/* 左侧职业角色导航 */}
                    <div className="w-80 bg-white border-r border-slate-200 flex flex-col">
                        {/* Logo区 */}
                        <div className="p-6 border-b border-slate-100">
                            <h1 className="text-2xl font-extrabold text-slate-800 flex items-center gap-2">
                                <span className="bg-slate-800 text-white w-8 h-8 flex items-center justify-center rounded-lg text-lg">📏</span>
                                <span>能力刻度尺</span>
                            </h1>
                            <p className="text-xs text-slate-400 mt-1 ml-10">v4.0 · INTJ能力树</p>
                        </div>

                        {/* 职业角色列表 */}
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-4">
                            <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-2">职业角色</div>
                            {careerRoles.map(role => {
                                const isActive = activeRoleId === role.id;
                                const roleSkillsData = skills.filter(s => role.skillIds.includes(s.id));
                                const totalCriteria = roleSkillsData.reduce((acc, skill) => 
                                    acc + skill.levels.reduce((sum, lvl) => sum + lvl.criteria.length, 0), 0
                                );
                                const completedCriteria = roleSkillsData.reduce((acc, skill) => 
                                    acc + skill.levels.reduce((sum, lvl) => sum + lvl.criteria.filter(c => c.done).length, 0), 0
                                );
                                const progress = Math.round((completedCriteria / totalCriteria) * 100);

                                return (
                                    <div key={role.id} className="mb-3">
                                        <button
                                            onClick={() => {
                                                setActiveRoleId(role.id);
                                                setActiveSkillId(role.skillIds[0]);
                                            }}
                                            className={`w-full text-left p-4 rounded-xl transition-all sidebar-nav
                                                ${isActive 
                                                    ? `bg-${role.color}-50 border-2 border-${role.color}-200 shadow-md` 
                                                    : 'bg-slate-50 border-2 border-transparent hover:border-slate-200'}
                                            `}
                                        >
                                            <div className="flex items-start gap-3">
                                                <span className="text-3xl">{role.icon}</span>
                                                <div className="flex-1">
                                                    <div className={`font-bold text-sm mb-1 ${isActive ? 'text-slate-800' : 'text-slate-600'}`}>
                                                        {role.name}
                                                    </div>
                                                    <div className="text-xs text-slate-500 mb-2">{role.description}</div>
                                                    
                                                    {/* 进度条 */}
                                                    <div className="w-full bg-slate-200 rounded-full h-1.5 mb-1">
                                                        <div 
                                                            className={`h-full rounded-full bg-gradient-to-r from-${role.color}-400 to-${role.color}-600 transition-all duration-500`}
                                                            style={{width: `${progress}%`}}
                                                        ></div>
                                                    </div>
                                                    <div className="text-xs text-slate-400">{progress}% 完成</div>
                                                </div>
                                            </div>
                                        </button>

                                        {/* 该角色下的能力列表 */}
                                        {isActive && (
                                            <div className="mt-2 ml-2 space-y-1">
                                                {roleSkillsData.map(skill => {
                                                    const isActiveSkill = activeSkillId === skill.id;
                                                    return (
                                                        <button
                                                            key={skill.id}
                                                            onClick={() => setActiveSkillId(skill.id)}
                                                            className={`w-full text-left px-4 py-2 rounded-lg flex items-center gap-2 transition-all role-badge
                                                                ${isActiveSkill 
                                                                    ? `bg-${skill.color}-100 text-${skill.color}-700 font-semibold` 
                                                                    : 'text-slate-600 hover:bg-slate-100'}
                                                            `}
                                                        >
                                                            <span className="text-lg">{skill.icon}</span>
                                                            <span className="text-xs">{skill.name}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {/* 底部信息 */}
                        <div className="p-4 border-t border-slate-100 text-center">
                            <p className="text-xs text-slate-400">INTJ Capability Framework</p>
                        </div>
                    </div>

                    {/* 右侧内容区 */}
                    <div className="flex-1 overflow-y-auto custom-scrollbar p-6 md:p-8">
                    {/* 当前角色面包屑 */}
                    <div className="mb-6 flex items-center gap-2 text-sm">
                        <span className="text-slate-400">当前角色:</span>
                        <span className="font-bold text-slate-700 flex items-center gap-1">
                            <span>{currentRole.icon}</span>
                            <span>{currentRole.name}</span>
                        </span>
                        <span className="text-slate-300">→</span>
                        <span className={`px-2 py-0.5 rounded text-xs font-bold bg-${currentSkill.color}-100 text-${currentSkill.color}-700`}>
                            {currentSkill.name}
                        </span>
                    </div>

                    {/* 主仪表盘 */}
                    <div className="bg-white rounded-2xl shadow-lg border border-slate-100 p-6 md:p-8 mb-8 relative overflow-hidden">
                        <div className={`absolute top-0 right-0 w-64 h-64 bg-${currentSkill.color}-50 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2 pointer-events-none`}></div>
                        <div className="flex flex-col md:flex-row gap-8 relative z-10">
                            <div className="flex-1">
                                <div className="flex items-baseline gap-3 mb-2">
                                    <span className="text-sm font-bold text-slate-400 uppercase tracking-wider">Current Status</span>
                                    <span className={`px-2 py-0.5 rounded text-xs font-bold bg-${currentSkill.color}-100 text-${currentSkill.color}-700`}>
                                        {currentSkill.name}
                                    </span>
                                </div>
                                <h2 className="text-5xl font-black text-slate-800 mb-4">
                                    Lv.{calculatedLevel}
                                    <span className="text-2xl text-slate-300 font-medium ml-2">/ 5</span>
                                </h2>
                                <p className="text-slate-600 mb-6 max-w-lg leading-relaxed">{currentSkill.description}</p>
                                <div>
                                    <div className="flex justify-between text-xs font-bold text-slate-400 mb-2">
                                        <span>MASTERY PROGRESS</span>
                                        <span>{progressStats.percent}%</span>
                                    </div>
                                    <div className="w-full bg-slate-100 rounded-full h-4 p-1">
                                        <div 
                                            className={`h-full rounded-full bg-gradient-to-r from-${currentSkill.color}-400 to-${currentSkill.color}-600 shadow-sm progress-bar`}
                                            style={{width: `${progressStats.percent}%`}}
                                        ></div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center justify-center md:justify-end md:w-1/3">
                                <div className={`
                                    w-48 h-48 rounded-full border-8 flex flex-col items-center justify-center shadow-inner transition-colors duration-500
                                    ${calculatedLevel === 5 ? 'bg-yellow-50 border-yellow-300' : 'bg-slate-50 border-slate-100'}
                                `}>
                                    <span className="text-6xl mb-2 animate-bounce" style={{animationDuration: '3s'}}>
                                        {calculatedLevel === 0 ? '🌱' : calculatedLevel === 1 ? '🔨' : calculatedLevel === 2 ? '⚔️' : calculatedLevel === 3 ? '🛡️' : calculatedLevel === 4 ? '🔮' : '👑'}
                                    </span>
                                    <span className="font-bold text-slate-700 text-lg">
                                        {calculatedLevel > 0 ? currentSkill.levels[calculatedLevel - 1].title.split(' ')[0] : '新手'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 任务列表区域 */}
                    <div className="space-y-6">
                        {currentSkill.levels.map((level, index) => {
                            const isUnlocked = index <= calculatedLevel;
                            const isCurrentTarget = index === calculatedLevel; 
                            const isCompleted = index < calculatedLevel;

                            return (
                                <div 
                                    key={level.lvl} 
                                    className={`level-card group relative rounded-2xl border-2 p-6 overflow-hidden transition-all
                                        ${isCompleted 
                                            ? 'bg-slate-50 border-slate-200 opacity-80' 
                                            : isCurrentTarget 
                                                ? `bg-white border-${currentSkill.color}-500 ring-4 ring-${currentSkill.color}-50 shadow-xl scale-[1.01]` 
                                                : 'bg-white border-slate-100 opacity-60 grayscale hover:grayscale-0 hover:opacity-90'}
                                    `}
                                >
                                    <div className="flex flex-col md:flex-row gap-6 relative z-10">
                                        <div className="md:w-1/4">
                                            <div className={`inline-flex items-center px-3 py-1 rounded-full text-xs font-bold mb-3
                                                ${isCompleted ? 'bg-slate-200 text-slate-600' : 
                                                  isCurrentTarget ? `bg-${currentSkill.color}-100 text-${currentSkill.color}-700` : 'bg-slate-100 text-slate-400'}
                                            `}>
                                                LEVEL {level.lvl}
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-800">{level.title}</h3>
                                            <p className="text-sm text-slate-500 mt-2 leading-relaxed">{level.desc}</p>
                                            
                                            {/* 新增：进入练习室按钮 */}
                                            <button 
                                                onClick={() => enterLevelDetail(index)}
                                                className={`mt-4 flex items-center gap-2 text-sm font-bold px-4 py-2 rounded-lg transition-all
                                                    ${isCurrentTarget || isCompleted 
                                                        ? `bg-white border border-slate-200 text-slate-700 hover:bg-${currentSkill.color}-50 hover:text-${currentSkill.color}-700 hover:border-${currentSkill.color}-200 shadow-sm` 
                                                        : 'hidden'}
                                                `}
                                            >
                                                <span>🚪 进入练习室</span>
                                                {level.logs.length > 0 && (
                                                    <span className="bg-slate-100 text-slate-500 px-1.5 rounded text-xs">{level.logs.length}</span>
                                                )}
                                            </button>
                                        </div>

                                        <div className="md:w-2/4 border-t md:border-t-0 md:border-l border-slate-100 pt-4 md:pt-0 md:pl-6">
                                            <h4 className="text-xs font-bold text-slate-400 uppercase mb-4 tracking-widest flex items-center gap-2">
                                                验收标准 Checklist
                                            </h4>
                                            <div className="space-y-3">
                                                {level.criteria.map(c => (
                                                    <label key={c.id} className="checkbox-wrapper flex items-start gap-3 cursor-pointer select-none">
                                                        <div className="relative pt-0.5">
                                                            <input 
                                                                type="checkbox" 
                                                                className="hidden" 
                                                                checked={c.done} 
                                                                onChange={() => toggleCriteria(index, c.id)}
                                                                disabled={!isCurrentTarget && !isCompleted}
                                                            />
                                                            <div className={`w-5 h-5 rounded border transition-colors duration-200 flex items-center justify-center
                                                                ${c.done 
                                                                    ? 'bg-emerald-500 border-emerald-500' 
                                                                    : 'bg-white border-slate-300 group-hover:border-blue-400'}
                                                            `}>
                                                                <svg className="w-3.5 h-3.5 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                                            </div>
                                                        </div>
                                                        <span className={`text-sm transition-all duration-300 ${c.done ? 'text-slate-400 line-through' : 'text-slate-700'}`}>
                                                            {c.text}
                                                        </span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="md:w-1/4 flex flex-col">
                                            <div className={`h-full rounded-xl p-4 border flex flex-col justify-center transition-colors
                                                ${level.criteria.every(c => c.done) && !isCompleted
                                                    ? 'bg-rose-50 border-rose-200' 
                                                    : 'bg-slate-50 border-slate-100'}
                                            `}>
                                                <div className="text-xs font-black text-rose-500 uppercase mb-2 flex items-center gap-1">
                                                    🔥 进阶挑战
                                                </div>
                                                <p className="text-sm font-medium text-slate-700 leading-snug">
                                                    {level.bossChallenge}
                                                </p>
                                                {level.criteria.every(c => c.done) && !isCompleted && (
                                                    <div className="mt-3 text-xs bg-white text-rose-600 px-2 py-1.5 rounded border border-rose-100 shadow-sm text-center animate-pulse font-bold">
                                                        挑战已激活，请进入练习室！
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {/* 能力元数据展示 */}
                    <div className="mt-12 bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <h3 className="text-sm font-bold text-slate-400 uppercase mb-4">📊 能力结构分析</h3>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                <div className="text-xs text-slate-400 mb-1">能力类型</div>
                                <div className="text-sm font-bold text-slate-700">{currentSkill.type === 'professional' ? '专业能力' : '技术能力'}</div>
                                <div className="text-xs text-slate-500 mt-1">{currentSkill.category}</div>
                            </div>
                            <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                <div className="text-xs text-slate-400 mb-1">核心技能</div>
                                <div className="text-xs text-slate-600 mt-2 space-y-1">
                                    {currentSkill.supportingSkills?.map((s, i) => (
                                        <div key={i} className="flex items-center gap-1">
                                            <span className="w-1 h-1 bg-slate-400 rounded-full"></span>
                                            <span>{s}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                <div className="text-xs text-slate-400 mb-1">工具生态</div>
                                <div className="flex flex-wrap gap-1 mt-2">
                                    {currentSkill.tools?.map((t, i) => (
                                        <span key={i} className="text-xs bg-white px-2 py-0.5 rounded border border-slate-200">{t}</span>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                                <div className="text-xs text-slate-400 mb-1">关键指标</div>
                                <div className="text-sm font-bold text-blue-600 mt-1">{currentSkill.metrics?.primary}</div>
                                <div className="text-xs text-slate-500 mt-1">
                                    {currentSkill.metrics?.secondary?.join(' · ')}
                                </div>
                            </div>
                        </div>
                    </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
